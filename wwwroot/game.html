<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The World Game | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #05070a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .neon-text { text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff; }
        .cyber-card {
            background: rgba(10,20,40,0.85); backdrop-filter: blur(12px);
            border: 1px solid #00d2ff; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,210,255,0.3);
        }
        #game-container { width:100%; height:500px; border-radius:12px; overflow:hidden; margin:20px 0; border:1px solid #00d2ff; }

        /* Sidebar */
        .trade-log-container {
            position: fixed; right: 20px; top: 150px; width: 260px;
            max-height: 400px; overflow-y: auto;
            background: rgba(10,20,40,0.9); border: 1px solid #00d2ff;
            border-radius: 8px; padding: 10px; font-size: 0.8rem; z-index: 500;
        }
        .trade-log-entry { border-bottom: 1px solid rgba(0,210,255,0.2); padding: 4px 0; }
        .mini-ranking {
            margin-top: 10px; background: rgba(0,210,255,0.1);
            border-radius: 6px; padding: 8px; font-size: 0.75rem;
        }
        .winner-btn { position: fixed; bottom: 20px; right: 20px; z-index: 500; }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- Selection Screen -->
        <div id="playerSelectSection" class="text-center py-5">
            <h1 class="display-3 fw-bold neon-text">🌍 THE WORLD GAME</h1>
            <p class="text-muted mb-5">CHOOSE YOUR NATION</p>
            <div id="playerSelect" class="row g-3 justify-content-center"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mb-0 neon-text">Welcome, <span id="playerName" class="text-info"></span></h1>
                    <p class="text-muted"><b>Strategy Lead | Global Market</b></p>
                </div>
                <div>
                    <button class="btn btn-outline-info me-2" onclick="showFullRanking()">🏆 Full Ranking</button>
                    <button class="btn btn-warning fw-bold me-2" onclick="processNextTurn()">🚀 EXECUTE TURN</button>
                    <button onclick="logout()" class="btn btn-outline-danger">Exit</button>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="cyber-card p-4">
                        <p class="text-muted mb-1">Balance</p>
                        <div class="display-4 fw-bold text-success" id="balance">0</div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="cyber-card p-4 d-flex justify-content-around">
                        <div><p class="text-muted mb-1">Game Mode</p><span id="gameModeBadge" class="badge bg-success fs-5">Normal</span></div>
                        <div><p class="text-muted mb-1">Turn</p><span id="turnNumber" class="text-warning fs-5 fw-bold">1</span></div>
                        <div>
                            <button id="startWarBtn" class="btn btn-sm btn-outline-danger" onclick="startWar()">💣 Start War</button>
                            <button id="endWarBtn" class="btn btn-sm btn-outline-success d-none" onclick="endWar()">☮️ End War</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="game-container"></div>

            <div class="row g-3 mt-4">
                <div class="col-md-4"><button onclick="location.href='market.html'" class="btn btn-dark w-100 py-3 border-neon">📈 Market Terminal</button></div>
                <div class="col-md-4"><button onclick="location.href='inventory.html'" class="btn btn-dark w-100 py-3 border-neon">📦 Inventory</button></div>
                <div class="col-md-4"><button onclick="location.href='leaderboard.html'" class="btn btn-dark w-100 py-3 border-neon">🏆 Full Rankings</button></div>
            </div>
        </div>
    </div>

    <!-- NEWS TICKER -->
    <div id="news-ticker" class="d-none"><div class="ticker-content" id="ticker-text"></div></div>

    <!-- TRADE POPUP -->
    <div class="modal fade" id="tradePopup">
        <div class="modal-dialog modal-lg">
            <div class="modal-content cyber-card text-white">
                <div class="modal-header border-bottom border-info">
                    <h5 class="modal-title">Trade with <span id="targetCountry"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><div class="row" id="trade-resource-list"></div></div>
            </div>
        </div>
    </div>

    <!-- Trade Log Sidebar -->
    <div id="tradeLogContainer" class="trade-log-container d-none">
        <h6 class="text-info">📋 LIVE TRADE LOG</h6>
        <div id="tradeLogEntries"></div>
        <div class="mini-ranking mt-3">
            <strong>🏁 TOP 3</strong>
            <div id="miniRanking"></div>
        </div>
    </div>

    <!-- Winner Button -->
    <button id="winnerBtn" class="btn btn-outline-warning winner-btn d-none" onclick="checkWinner()">🏆 Declare Winner</button>

    <!-- Winner Modal -->
    <div class="modal fade" id="winnerModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content cyber-card text-white text-center p-4">
                <h2 class="text-warning mb-3">🏆 GLOBAL ECONOMIC LEADER</h2>
                <div id="winnerFlag" style="font-size:5rem;"></div>
                <div id="winnerName" class="display-4 fw-bold neon-text"></div>
                <div id="winnerWealth" class="text-success fs-3"></div>
            </div>
        </div>
    </div>

    <!-- Full Ranking Modal (new) -->
    <div class="modal fade" id="fullRankingModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content cyber-card text-white">
                <div class="modal-header border-bottom border-info">
                    <h5 class="modal-title">🏆 GLOBAL RANKING</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="fullRankingBody"></div>
            </div>
        </div>
    </div>

    <!-- War Inventory Modal (new) -->
    <div class="modal fade" id="warInventoryModal">
        <div class="modal-dialog">
            <div class="modal-content cyber-card text-white">
                <div class="modal-header border-bottom border-danger">
                    <h5 class="modal-title">⚔️ WAR INVENTORY OVERVIEW</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="warInventoryBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="script.js"></script>
    <script src="map.js"></script>
</body>
</html>
