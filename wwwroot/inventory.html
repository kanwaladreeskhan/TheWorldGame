<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory | World Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">
    <div class="container">
        <a class="btn btn-sm btn-outline-info rounded-pill px-3 mb-3" href="index.html">← Dashboard</a>
        <h1 class="display-6 fw-bold"><i class="fas fa-box-open me-3 text-info"></i>Your Inventory</h1>
        <div id="playerInfoHeader" class="text-end glass-card p-3 mb-4">Loading...</div>
        <div class="cyber-card p-4">
            <table class="table table-dark align-middle" id="inventoryTable">
                <thead>
                    <tr><th>RESOURCE</th><th>QUANTITY</th><th class="text-end">MARKET VALUE</th></tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = window.location.origin + "/api";
        function cleanName(n) { return n.replace(/AI$/i, ''); }
        function getFlagUrl(country) {
            const map = { "Pakistan": "pk", "USA": "us", "China": "cn", "Germany": "de", "Japan": "jp", "India": "in", "UK": "gb", "Russia": "ru", "UAE": "ae" };
            const code = map[cleanName(country)] || "un";
            return `https://flagcdn.com/w80/${code}.png`;
        }

        async function loadInventory() {
            const player = JSON.parse(localStorage.getItem('currentPlayer')) || { Id: 1, Name: "Pakistan" };
            document.getElementById('playerInfoHeader').innerHTML = `<img src="${getFlagUrl(player.Name || player.name)}" style="width:30px; margin-right:8px;">${cleanName(player.Name || player.name)}`;
            try {
                const [marketRes, invRes] = await Promise.all([
                    fetch(`${API_URL}/market`),
                    fetch(`${API_URL}/player/${player.Id}/inventory`)
                ]);
                const markets = await marketRes.json();
                const inventory = await invRes.json();
                const tbody = document.getElementById('inventoryBody');
                if (!inventory || inventory.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No items.</td></tr>';
                    return;
                }
                tbody.innerHTML = inventory.map(item => {
                    const mkt = markets.find(m => m.ResourceId === item.ResourceId || m.Id === item.ResourceId);
                    const price = mkt ? mkt.CurrentPrice : 0;
                    const total = item.Quantity * price;
                    return `<tr>
                        <td>${item.ResourceName}</td>
                        <td>${item.Quantity}</td>
                        <td class="text-end">$${Math.floor(total).toLocaleString()}</td>
                    </tr>`;
                }).join('');
            } catch (err) { console.error(err); }
        }
        window.onload = loadInventory;
    </script>
</body>
</html>
