<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Market | World Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a class="btn btn-sm btn-outline-info rounded-pill px-3" href="index.html">← Dashboard</a>
            <h1 class="fw-bold mb-0 neon-text">MARKET TERMINAL</h1>
            <div id="playerStats" class="text-end">
                <span id="playerNameDisplay" class="me-2 text-info small fw-bold"></span>
                <span id="playerBalanceDisplay" class="badge bg-success"></span>
            </div>
        </div>

        <div class="cyber-card p-4">
            <table class="table table-dark align-middle mb-0">
                <thead class="text-muted small">
                    <tr>
                        <th>RESOURCE</th>
                        <th>LIVE PRICE</th>
                        <th>SUPPLY</th>
                        <th class="text-center">ACTION</th>
                    </tr>
                </thead>
                <tbody id="marketBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + "/api";
        function cleanName(n) { return n.replace(/AI$/i, ''); }
        function getFlagUrl(country) {
            const map = { "Pakistan": "pk", "USA": "us", "China": "cn", "Germany": "de", "Japan": "jp", "India": "in", "UK": "gb", "Russia": "ru", "UAE": "ae" };
            const code = map[cleanName(country)] || "un";
            return `https://flagcdn.com/w80/${code}.png`;
        }

        async function loadMarket() {
            const player = JSON.parse(localStorage.getItem('currentPlayer'));
            if (player) {
                document.getElementById('playerNameDisplay').innerHTML = `<img src="${getFlagUrl(player.Name || player.name)}" style="width:25px; margin-right:5px;">${cleanName(player.Name || player.name)}`;
                document.getElementById('playerBalanceDisplay').innerText = '$' + (player.Balance || 0).toLocaleString();
            }
            try {
                const res = await fetch(`${API_URL}/market`);
                const data = await res.json();
                document.getElementById('marketBody').innerHTML = data.map(item => {
                    return `
                    <tr>
                        <td class="py-4">${item.Name}</td>
                        <td class="py-4 text-success">$${item.CurrentPrice?.toFixed(2)}</td>
                        <td class="py-4 text-muted">${item.Supply || 0}</td>
                        <td class="text-center py-4">
                            <input type="number" id="qty-${item.ResourceId || item.Id}" class="form-control form-control-sm d-inline bg-dark text-white" style="width:70px;" value="1" min="1">
                            <button class="btn btn-sm btn-primary" onclick="quickTrade(${item.ResourceId || item.Id}, 'BUY')">BUY</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="quickTrade(${item.ResourceId || item.Id}, 'SELL')">SELL</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (err) { console.error(err); }
        }

        async function quickTrade(resourceId, action) {
            const player = JSON.parse(localStorage.getItem('currentPlayer'));
            if (!player) return alert("Select a nation first!");
            const qty = parseInt(document.getElementById(`qty-${resourceId}`).value);
            if (isNaN(qty) || qty <= 0) return alert("Invalid quantity");
            try {
                const res = await fetch(`${API_URL}/trade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ PlayerId: player.PlayerId || player.Id, ResourceId: resourceId, Action: action, Quantity: qty })
                });
                if (res.ok) {
                    loadMarket();
                    // update localStorage balance
                    const updated = await (await fetch(`${API_URL}/player/${encodeURIComponent(player.Name)}`)).json();
                    localStorage.setItem('currentPlayer', JSON.stringify(updated));
                } else {
                    const err = await res.json();
                    alert(err.message || "Trade failed");
                }
            } catch (e) { alert("Network error"); }
        }

        window.onload = loadMarket;
    </script>
</body>
</html>
