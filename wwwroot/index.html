<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WORLD GAME</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #05070a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .grid-bg {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background-image: 
                linear-gradient(rgba(0,210,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,210,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index:0;
        }
        .content { position: relative; z-index:1; max-width:1000px; padding:20px; }
        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            letter-spacing:4px;
            margin-bottom:5px;
        }
        h2 { color:#aaa; letter-spacing:2px; margin-bottom:50px; }
        .ministers { display: flex; flex-wrap: wrap; justify-content: center; gap:25px; }
        .card {
            background: rgba(0,210,255,0.08);
            border:1px solid rgba(0,210,255,0.25);
            border-radius:12px;
            width:150px;
            padding:15px 10px;
            opacity:0;
            transform: translateY(30px);
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card.show { opacity:1; transform: translateY(0); }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0,210,255,0.5);
            object-fit: cover;
            margin-bottom: 10px;
            background-color: #0a1a2f; /* fallback if image missing */
        }
        .flag { font-size:2.2rem; margin-bottom:8px; }
        .name {
            font-weight:bold;
            font-size:1rem;
            text-shadow:0 0 5px #00d2ff;
            margin-top:5px;
        }
        .role {
            font-size:0.7rem;
            color:#88ccff;
            margin-top:2px;
        }
        .enter-btn {
            margin-top:60px;
            background: rgba(0,210,255,0.15);
            border:2px solid #00d2ff;
            color:#00d2ff;
            font-size:1.4rem;
            padding:12px 40px;
            border-radius:8px;
            cursor:pointer;
            text-transform:uppercase;
            letter-spacing:2px;
            box-shadow:0 0 20px rgba(0,210,255,0.4);
            transition:0.3s;
            opacity:0;
            animation: fadeUp 1s forwards;
            animation-delay:3.5s;
        }
        .enter-btn:hover { background:#00d2ff; color:black; box-shadow:0 0 40px #00d2ff; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
        .overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:black; opacity:0; pointer-events:none; z-index:9999;
            transition: opacity 0.8s ease;
        }
        .overlay.on { opacity:1; pointer-events:all; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="content">
        <h1>🌍 THE WORLD GAME</h1>
        <h2>FOREIGN MINISTERS ASSEMBLY</h2>
        <div class="ministers" id="ministers"></div>
        <button class="enter-btn" onclick="goToGame()">➤ ENTER THE WORLD GAME</button>
    </div>
    <div class="overlay" id="overlay"></div>
    <script>
        // List of countries – image files MUST be placed in "images/ministers/" folder
        const ministers = [
            { name: "Pakistan", image: "./images/ministers/pakistan.png" },
            { name: "USA", image: "images/ministers/usa.png" },
            { name: "China", image: "images/ministers/china.png" },
            { name: "Germany", image: "images/ministers/germany.png" },
            { name: "Japan", image: "images/ministers/japan.png" },
            { name: "India", image: "images/ministers/india.png" },
            { name: "UK", image: "images/ministers/uk.png" },
            { name: "Russia", image: "images/ministers/russia.png" },
            { name: "UAE", image: "images/ministers/uae.png" }
        ];

        const flagEmojis = {
            "Pakistan": "🇵🇰",
            "USA": "🇺🇸",
            "China": "🇨🇳",
            "Germany": "GE",
            "Japan": "🇯🇵",
            "India": "🇮🇳",
            "UK": "UK",
            "Russia": "🇷🇺",
            "UAE": "u🇦🇪"
        };

        const grid = document.getElementById('ministers');
        ministers.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'card';

            // Create image element with fallback
            const img = new Image();
            img.className = 'avatar';
            img.src = m.image;
            img.alt = m.name + ' Minister';
            img.onerror = function() {
                // If image fails to load, show a generic silhouette
                this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="35" r="22" fill="%23888"/%3E%3Crect x="30" y="55" width="40" height="40" fill="%23333"/%3E%3Cpolygon points="50,65 45,55 55,55" fill="%23333"/%3E%3Ctext x="50" y="45" text-anchor="middle" fill="white" font-size="12" font-family="sans-serif"%3EN/A%3C/text%3E%3C/svg%3E';
            };

            const flagSpan = document.createElement('div');
            flagSpan.className = 'flag';
            flagSpan.textContent = flagEmojis[m.name] || '🏳️';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.textContent = m.name;

            const roleDiv = document.createElement('div');
            roleDiv.className = 'role';
            roleDiv.textContent = 'Foreign Minister';

            div.appendChild(img);
            div.appendChild(flagSpan);
            div.appendChild(nameDiv);
            div.appendChild(roleDiv);

            grid.appendChild(div);
            setTimeout(() => div.classList.add('show'), 500 + i * 300);
        });

        function goToGame() {
            document.getElementById('overlay').classList.add('on');
            setTimeout(() => { window.location.href = 'game.html'; }, 800);
        }
    </script>
</body>
</html>
